x-app-common: &app-common
  build: ./server/
  image: failover-t-talk-server:latest
  restart: unless-stopped
  environment:
    PORT: ${PORT}
    HOST: ${HOST}
    DATABASE_URL: ${AWS_PSQL_URL}
    JWT_SECRET: ${JWT_SECRET}
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  networks:
    - internal

services:
  app1:
    <<: *app-common
  app2:
    <<: *app-common
  app3:
    <<: *app-common

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./data/prometheus:/prometheus"
    networks:
      - internal

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    depends_on:
      - prometheus
    volumes:
      - "./data/grafana:/var/lib/grafana"
    networks:
      - internal
  
  web:
    build: ./t-talk/
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    networks:
      - internal

networks:
  internal:
    driver: bridge